<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameLog</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>GameLog</h1>
    <p class="subtitle">catálogo e resenhas de jogos - tudo passando pelo API Gateway (porta 8080)</p>
  </header>

  <main class="columns">
    <section class="column">
      <h2>Jogos</h2>
      <p class="subtitle">catalog-service / PostgreSQL</p>
      <div id="game-list"><p class="empty">carregando...</p></div>
    </section>

    <section class="column">
      <h2 id="reviews-title">Resenhas</h2>
      <p class="subtitle">review-service / MongoDB</p>
      <p id="summary" class="summary"></p>
      <div id="review-list"><p class="empty">selecione um jogo ao lado</p></div>

      <div class="card" id="form-card" hidden>
        <h3>Nova resenha</h3>
        <form id="review-form">
          <label for="author">Seu nome</label>
          <input type="text" id="author" required>

          <label for="rating">Nota</label>
          <select id="rating">
            <option value="5">5 - Obra prima</option>
            <option value="4">4 - Muito bom</option>
            <option value="3" selected>3 - Ok</option>
            <option value="2">2 - Fraco</option>
            <option value="1">1 - Ruim</option>
          </select>

          <label for="text">Resenha</label>
          <textarea id="text" required></textarea>

          <button type="submit">Publicar</button>
          <p id="message" class="message"></p>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
