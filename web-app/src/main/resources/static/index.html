<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameLog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="wordmark">GameLog</span>
    </div>
  </header>

  <div class="page">
    <main class="layout">
      <section aria-labelledby="catalog-heading">
        <div class="panel-head">
          <h2 id="catalog-heading">Jogos</h2>
          <span class="origin">catalog-service · postgres</span>
        </div>
        <div id="game-list" class="stack">
          <p class="empty">Carregando o catálogo…</p>
        </div>
      </section>

      <section aria-labelledby="reviews-heading">
        <div class="panel-head">
          <h2 id="reviews-heading">Resenhas</h2>
          <span class="origin">review-service · mongodb</span>
        </div>

        <p id="reviews-for" class="reviews-for" hidden></p>
        <div id="summary" class="summary"></div>

        <div id="review-list">
          <p class="empty">Escolha um jogo para ler e escrever resenhas.</p>
        </div>

        <div class="composer" id="composer" hidden>
          <h3>Escrever resenha</h3>
          <form id="review-form">
            <div class="row">
              <div class="field">
                <label for="author">Seu nome</label>
                <input type="text" id="author" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="rating">Nota</label>
                <select id="rating">
                  <option value="5">5 · obra prima</option>
                  <option value="4">4 · muito bom</option>
                  <option value="3" selected>3 · ok</option>
                  <option value="2">2 · fraco</option>
                  <option value="1">1 · ruim</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="text">O que você achou</label>
              <textarea id="text" required></textarea>
            </div>

            <button type="submit">Publicar resenha</button>
            <p id="message" class="message" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
