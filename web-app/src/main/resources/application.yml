server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: web-app
  web:
    resources:
      cache:
        # the page and its assets are static, no need to fetch them on every load
        cachecontrol:
          max-age: 1h

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health
