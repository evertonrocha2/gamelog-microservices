server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// resolve o nome do servico via eureka
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/games/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**
        # pagina e assets da interface web
        - id: web-app
          uri: lb://web-app
          predicates:
            - Path=/,/index.html,/favicon.ico,/css/**,/js/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
