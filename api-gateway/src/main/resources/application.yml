server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// = load balanced via Eureka, resolve pelo nome logico do servico
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/games/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
