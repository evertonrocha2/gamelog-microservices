# one database per service: postgres for the catalog, mongo for the reviews
services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelog-postgres
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: gamelog
      POSTGRES_PASSWORD: gamelog
    ports:
      # 5433 to avoid clashing with a local postgres; loopback keeps it off the network
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: gamelog-mongo
    ports:
      # same idea as postgres
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
