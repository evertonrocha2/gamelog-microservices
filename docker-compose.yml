# um banco pra cada servico: postgres pro catalogo, mongo pras resenhas
services:
  postgres:
    image: postgres:16-alpine
    container_name: gamelog-postgres
    environment:
      POSTGRES_DB: catalogdb
      POSTGRES_USER: gamelog
      POSTGRES_PASSWORD: gamelog
    ports:
      # 5433 pra nao brigar com postgres local; loopback pra nao expor na rede
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: gamelog-mongo
    ports:
      # mesma ideia do postgres
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
